name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          ls -la "$SDK_DIR/build-tools"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Release & Debug APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Sign Release APK
        run: |
          mkdir -p release-apks
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias pharmaflow \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pharmaflow123 \
            -keypass pharmaflow123 \
            -dname "CN=PharmaFlow, OU=Pharmacy, O=PharmaFlow, L=Sahiwal, S=Punjab, C=PK"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="release-apks/app-release-aligned.apk"
          SIGNED_APK="release-apks/PharmaFlow-v1.0.${{ github.run_number }}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias pharmaflow \
            --ks-pass pass:pharmaflow123 \
            --key-pass pass:pharmaflow123 \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          rm -f "$ALIGNED_APK" release-key.jks

          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apks/PharmaFlow-v1.0.${{ github.run_number }}-debug.apk"
          ls -lh release-apks/

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          SIGNED_APK="release-apks/PharmaFlow-v1.0.${{ github.run_number }}.apk"
          DEBUG_APK="release-apks/PharmaFlow-v1.0.${{ github.run_number }}-debug.apk"
          gh release create "$TAG" \
            "$SIGNED_APK" \
            "$DEBUG_APK" \
            --title "PharmaFlow Android APK ($TAG)" \
            --notes "Automated Android APK build for PharmaFlow Order Management & Invoice Generator (preloaded with Al Barkat distribution backup data & transparent PharmaFlow branding). Download **PharmaFlow-$TAG.apk** to install directly on Android devices." \
            --latest
