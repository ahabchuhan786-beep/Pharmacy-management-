<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Pharmacy Medical Cross Symbol -->
  <g filter="url(#shadow)">
    <!-- Horizontal Cross Bar -->
    <rect x="96" y="200" width="320" height="112" rx="28" fill="url(#crossGrad)" />
    <!-- Vertical Cross Bar -->
    <rect x="200" y="96" width="112" height="320" rx="28" fill="url(#crossGrad)" />
  </g>
  
  <!-- Heartbeat / EKG Pulse in Center of Cross -->
  <path d="M 120 256 L 195 256 L 220 216 L 245 296 L 270 236 L 295 272 L 315 256 L 392 256" 
        fill="none" stroke="#0ea5e9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Pill / Capsule accent -->
  <circle cx="256" cy="256" r="10" fill="#0284c7" />
</svg>
